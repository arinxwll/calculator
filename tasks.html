<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tasks</title>
        <link rel="stylesheet" href="styles/tasks.css">
    </head>
    <body>
        <div class="tasks-page">
            <div class="header-section">
                <h1>Tasks</h1>
                <button class="add-task-btn">+ Add Task</button>
            </div>
            <div class="search-section">
                <div class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" placeholder="Search tasks...">
                </div>
            </div>
            <div class="task-list">
                <div class="task-item">
                    <input type="checkbox">
                    <span class="task-name">Погасить кредит</span>
                </div>
                <div class="task-item">
                    <input type="checkbox">
                    <span class="task-name">Отложить деньги</span>
                </div>
                <div class="task-item">
                    <input type="checkbox">
                    <span class="task-name">Спланирoвать расходы на следующую неделю</span>
                </div>
                <div class="task-item">
                    <input type="checkbox">
                    <span class="task-name">Обновить инвестиционный портфель</span>
                </div>
                <div class="task-item">
                    <input type="checkbox">
                    <span class="task-name">Отправлять отчеты о расходах</span>
                </div>
            </div>
        </div>
            </body>
        </html>

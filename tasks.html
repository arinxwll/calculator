<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tasks</title>
        <link rel="stylesheet" href="styles/tasks.css">
    </head>
    <body>
        <div class="tasks-page">
            <div class="header-section">
                <h1>Tasks</h1>
                <button class="add-task-btn">+ Add Task</button>
            </div>
            <div class="search-section">
                <div class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" placeholder="Search tasks...">
                </div>
            </div>
            <div class="tab">
                <button class="tablinks" onclick="openCity(event, 'All')">All</button>
                <button class="tablinks" onclick="openCity(event, 'Pending')">Pending</button>
                <button class="tablinks" onclick="openCity(event, 'Completed')">Completed</button>
              </div>
              <div id="London" class="tabcontent">
                <h3>All</h3>
                <p><div class=""></div></p>
              </div>
              
              <div id="Pending" class="tabcontent">
                <h3>Pending</h3>
                <p>.</p>
              </div>
              
              <div id="Completed" class="tabcontent">
                <h3>Completed</h3>
                <p>.</p>
              </div>
            <div class="task-list">
                <div class="task-item">
                    <input type="checkbox">
                    <span class="task-name">Погасить кредит</span>
                </div>
                <div class="task-item">
                    <input type="checkbox">
                    <span class="task-name">Отложить деньги</span>
                </div>
                <div class="task-item">
                    <input type="checkbox">
                    <span class="task-name">Спланирoвать расходы на следующую неделю</span>
                </div>
                <div class="task-item">
                    <input type="checkbox">
                    <span class="task-name">Обновить инвестиционный портфель</span>
                </div>
                <div class="task-item">
                    <input type="checkbox">
                    <span class="task-name">Отправлять отчеты о расходах</span>
                </div>
            </div>
        </div>
        <script>
            function openCity(evt, cityName) {
              var i, tabcontent, tablinks;
              tabcontent = document.getElementsByClassName("tabcontent");
              for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
              }
              tablinks = document.getElementsByClassName("tablinks");
              for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
              }
              document.getElementById(cityName).style.display = "block";
              evt.currentTarget.className += " active";
            }
            
            document.getElementById("defaultOpen").click();
            </script>
            </body>
        </html>

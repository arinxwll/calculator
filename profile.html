<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="styles/styles.css">
  <body class="container">
     <header class="navbar">
        <div class="container">
          <div class="items">
            <a href="transactions.html" class="item">Transactions</a>
            <a href="analytics.html" class="item">Analytics</a>
            <a href="tasks.html" class="item">Tasks</a>
            <a href="home.html" class="item">Home</a>
            <a href="profile.html" class="item active">Profile</a>
            </div>
          </div>
        </header>
        <main class="content-area">
          <div class="profile-container">
          </div>
        </main>
        <title>Profile Page</title>
        <link rel="stylesheet" href="styles/profile.css">
    </head>
   <body>
        <div class="profile-container">
            <h1 class="page-title">Profile</h1>
 
            <div class="profile-main-card">
                <div class="user-info-section">
                    <div class="avatar-circle" id="profileAvatar">AS</div>
                    <div class="user-details">
                        <div class="user-name" id="profileName" >Arina Sharabura</div>
                        <div class="user-email"id="profileEmail">arina.200011@email.com</div>
                        <div class="member-date"id="memberSince">Member since May 2025</div>
                    </div>
                </div>
                <button class="edit-btn"onclick="openEditProfileModal()">Edit</button>
            </div>
  
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon icon-green">$</div>
                    <div class="stat-value" id="CurrentBalance">$0,00</div> 
                    <div class="stat-label">Current Balance</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon icon-blue">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-repeat">
                            <polyline points="17 1 21 5 17 9"></polyline>
                            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                            <polyline points="7 23 3 19 7 15"></polyline>
                            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                        </svg>
                    </div>
                    <div class="stat-value" id="profileTransCount">0</div> 
                    <div class="stat-label">Transactions</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon icon-purple">
                   
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-check-square">
                            <polyline points="9 11 12 14 22 4"></polyline>
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                        </svg>
                    </div>
                    <div class="stat-value" id="profileTasksCount">10</div>
                    <div class="stat-label">Completed Tasks</div>
                </div>
            </div>
        </div>
        <div class="modal-overlay" id="editProfileModal">
            <div class="modal-content">
                <h3>Edit Profile</h3>
                <div class="form-group">
                    <label for="editAvatarInput">Avatar (initials)</label>
                    <input type="text" id="editAvatarInput" placeholder="e.g., AS">
                </div>
                <div class="form-group">
                    <label for="editNameInput">Name</label>
                    <input type="text" id="editNameInput" name="profileName" placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label for="editEmailInput">Email</label>
                    <input type="email" id="editEmailInput" name="profileEmail" placeholder="your.email@example.com">
                </div>
                <div class="form-group">
                    <label for="editPasswordInput">Password</label>
                    <input type="password" id="editPasswordInput" name="password" placeholder="your.email@example.com">
                </div>
                <div class="modal-actions">
                    <button class="btn-cancel" onclick="closeEditProfileModal()">Cancel</button>
                    <button class="btn-add" onclick="saveProfileChanges()">Save</button>
                </div>
            </div>
        </div>
        <script src="scripts/profile.js"></script>
    
    </body>
    </html>

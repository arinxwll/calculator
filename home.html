<!doctype html>
<html lang="en">
    <link rel="stylesheet" href="styles/home.css">
    <header class="navbar">
            <div class="dashboard-page">
                <div class="header-info">
                     <div class="information">
                         <div class="user-avatar">A</div>
                             <span class="user-name">Arina Sharabura</span>
                         </div>
                         </div>
                     </div>
                    </header>
                    <div class="balance-card">
                        <div class="balance-top">
                            <span class="label">Current Balance</span>
                        <div class="trend" id="balanceTrend">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-arrow-up">
                                    <line x1="12" y1="19" x2="12" y2="5"></line>
                                    <polyline points="5 12 12 5 19 12"></polyline>
                                </svg>
                                <span id="balanceTrendPercentage">--</span> 
                            </div>
                        </div>
                        <div class="balance-amount" id="currentBalanceValue">$0.00</div> 
                        <button class="edit-btn" onclick="openQuickAddModal('balance')">
                
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                            </svg>
                        </button>
                    </div>

                    <div class="balance-details">
                        <div class="detail-item">
                            <span class="label">This Month Income</span>
                            <span class="value" id="monthlyIncomeValue">$0.00</span>
                        </div>
                        <div class="detail-item">
                            <span class="label">This Month Expenses</span>
                            <span class="value" id="monthlyExpensesValue">$0.00</span>
                        </div>
                    </div>
                    <section class="quick-actions">
                        <h3 class="section-title">Quick Actions</h3>
                        <div class="action-buttons">
                            <button class="action-btn btn-income">
                                <span class="btn-icon">+</span>
                                Add Income
                            </button>
                            <button class="action-btn btn-expense">
                                <span class="btn-icon">-</span>
                                Add Expense
                            </button>
                        </div>
                     </section>
                 <body>
    <script src="scripts/recent_transactions.js"></script>
    <script src="scripts/home.js"></script>
</body>
</html>

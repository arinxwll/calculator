<!doctype html>
<html lang="en">
    <link rel="stylesheet" href="styles/analytics.css">
    <main class="analytics-container">
        <div class="analytics-section">
            <div class="stat-card">
              <div class="card-header">
                <div class="icon-box blue-bg">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
                </div>
                <span class="percentage">+12.5%</span>
              </div>
              <div class="card-body">
                <p class="label">Total Expenses</p>
                <h3 class="value">$45,280</h3>
              </div>
            </div>
            <div class="stat-card">
              <div class="card-header">
                <div class="icon-box blue-bg">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                </div>
                <span class="percentage">+8.2%</span>
              </div>
              <div class="card-body">
                <p class="label">This Month</p>
                <h3 class="value">$12,450</h3>
              </div>
            </div>
            <div class="stat-card">
              <div class="card-header">
                <div class="icon-box blue-bg">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2"><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2 .5-.5 1-1 1-2.5z"></path></svg>
                </div>
                <span class="green">+15.3%</span>
              </div>
              <div class="card-body">
                <p class="label">Saved Amount</p>
                <h3 class="value">$28,750</h3>
              </div>
            </div>
          </div>
        </main>
        <script src="https://www.google.com/jsapi"></script>
        <script>
         google.load("visualization", "1", {packages:["corechart"]});
         google.setOnLoadCallback(drawChart);
         function drawChart() {
          var data = google.visualization.arrayToDataTable([
          ['expense', 'categories'],
           ['food',     53.09],
           ['closes', 20.95],
           ['traveling',    10.93],
           ['transport', 15.03]
          ]);
          var options = {
           title: 'Expense categories',
           is3D: true,
           pieResidueSliceLabel: 'other'
          };
          var chart = new google.visualization.PieChart(document.getElementById('expense'));
           chart.draw(data, options);
         }
        </script>
        <div id="expense" style="width: 500px; height: 400px;"></div>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
      <body>
          <div style="width: 50%; margin: auto;">
              <canvas id="myChart"></canvas>
          </div>
          
          <script>
              const ctx = document.getElementById('myChart').getContext('2d');
              const myChart = new Chart(ctx, {
                  type: 'bar',
                  data: {
                      labels: ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'],
                      datasets: [{
                          label: 'Expenses',
                          data: [298, 720, 512, 811, 678, 446, 398, 587, 904, 788, 603, 720],
                          backgroundColor: ['rgba(3, 252, 152)'],
                          borderColor: ['rgba(3, 198, 252)'],
                          borderWidth: 1
                      }]
                  }
              });
          </script>
       </body>
      </html>
